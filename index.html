<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Sintáctico: Oraciones Unimembres y Bimembres</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 1rem;
        }

        .game-container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        header h1 {
            color: #4338ca;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #334155;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #6366f1;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #475569;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 10px;
        }

        .sentence-card {
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            padding: 2rem 1rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
        }

        .sentence-card h2 {
            font-size: 1.35rem;
            color: #0f172a;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn.unimembre {
            background-color: #f59e0b;
        }

        .btn.bimembre {
            background-color: #10b981;
        }

        .btn.primary, .btn.restart {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            width: 100%;
        }

        .btn.next {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            width: 100%;
            margin-top: 1rem;
        }

        #feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 500;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        #feedback.correct {
            background-color: #dcfce7;
            color: #166534;
            border-left: 5px solid #22c55e;
        }

        #feedback.incorrect {
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 5px solid #ef4444;
        }

        .trophy {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- PANTALLA DE BIENVENIDA -->
        <div id="welcome-box">
            <header>
                <h1>🎓 Desafío Sintáctico</h1>
                <p>Pon a prueba tus conocimientos sobre <strong>Oraciones Unimembres y Bimembres</strong>.</p>
            </header>
            <div class="input-group">
                <label for="student-name">Ingresa tu nombre completo:</label>
                <input type="text" id="student-name" placeholder="Ej. Ana Pérez" autocomplete="off">
            </div>
            <button class="btn primary" onclick="startGame()">Comenzar Reto</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="quiz-box" class="hidden">
            <header>
                <h1 id="greeting-title">¡Hola!</h1>
                <p>Clasifica correctamente cada oración:</p>
            </header>

            <div class="stats">
                <span id="progress">Pregunta 1 de 10</span>
                <span id="score">Puntuación: 0</span>
            </div>

            <div class="sentence-card">
                <h2 id="sentence-text">Cargando oración...</h2>
            </div>

            <div class="button-group">
                <button id="btn-ou" class="btn unimembre" onclick="checkAnswer('OU')">Unimembre (OU)</button>
                <button id="btn-ob" class="btn bimembre" onclick="checkAnswer('OB')">Bimembre (OB)</button>
            </div>

            <div id="feedback" class="hidden"></div>
            
            <button id="next-btn" class="btn next hidden" onclick="nextQuestion()">Siguiente Pregunta ➔</button>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="result-box" class="hidden">
            <div class="trophy">🏆</div>
            <h2>¡Felicitaciones, <span id="res-name"></span>!</h2>
            <p id="final-score" style="margin: 1.2rem 0; font-size: 1.1rem; color: #475569;">Tu puntuación final es: 0 de 10</p>
            <button class="btn restart" onclick="restartGame()">Jugar de Nuevo 🔄</button>
        </div>
    </div>

    <script>
        const masterQuestions = [
            // UNIMEMBRES (OU)
            { text: "¡Llueve!", type: "OU", explanation: "Es unimembre porque posee un verbo impersonal de fenómeno atmosférico, sin sujeto." },
            { text: "¡Auxilio!", type: "OU", explanation: "Es unimembre exclamativa; transmite una expresión de ayuda sin estructura de sujeto y predicado." },
            { text: "Hace mucho frío.", type: "OU", explanation: "Es unimembre debido a la impersonalidad del verbo 'hacer'." },
            { text: "Es de noche.", type: "OU", explanation: "Es unimembre porque utiliza el verbo copulativo de forma impersonal para indicar tiempo." },
            { text: "Había muchos invitados.", type: "OU", explanation: "Es unimembre porque el verbo 'haber' es impersonal y no admite sujeto gramatical." },
            { text: "¡Fuego!", type: "OU", explanation: "Es una oración unimembre nominal de carácter exclamativo." },
            { text: "¡Silencio, por favor!", type: "OU", explanation: "Es unimembre nominal; emite una orden directa sin descomponerse en sujeto y predicado." },
            { text: "Truena fuerte.", type: "OU", explanation: "Es unimembre por tratarse de un fenómeno meteorológico expresado mediante verbo impersonal." },
            { text: "Hubo un terremoto.", type: "OU", explanation: "Es unimembre dado que el verbo 'haber' actúa de forma impersonal." },
            { text: "¡Qué alegría!", type: "OU", explanation: "Es unimembre nominal exclamativa sin nexo predicativo." },
            { text: "Amanece temprano.", type: "OU", explanation: "Es unimembre porque refiere a un fenómeno de la naturaleza con verbo impersonal." },
            { text: "¡Hola!", type: "OU", explanation: "Es unimembre de tipo fórmula social o interjección." },
            { text: "Se vende casa.", type: "OU", explanation: "Es unimembre con estructura de pasiva refleja impersonal." },
            { text: "¡Cuidado!", type: "OU", explanation: "Es unimembre de carácter imperativo/interjectivo." },
            { text: "Hace calor hoy.", type: "OU", explanation: "Es unimembre por el uso impersonal del verbo 'hacer'." },
            { text: "¡Prohibido fumar!", type: "OU", explanation: "Es unimembre impersonal con verbo en infinitivo." },
            { text: "Es tarde.", type: "OU", explanation: "Es unimembre por el uso impersonal del verbo 'ser' al indicar tiempo." },
            { text: "Hay demasiados problemas.", type: "OU", explanation: "Es unimembre por la naturaleza impersonal del verbo 'haber'." },
            { text: "¡Bravo!", type: "OU", explanation: "Es unimembre interjectiva de aprobación." },
            { text: "Relampaguea en la costa.", type: "OU", explanation: "Es unimembre debido al verbo impersonal de fenómeno meteorológico." },
            { text: "¡Qué desastre!", type: "OU", explanation: "Es unimembre nominal exclamativa." },
            { text: "Nevará mañana.", type: "OU", explanation: "Es unimembre por el verbo impersonal de clima." },
            { text: "Se alquila apartamento.", type: "OU", explanation: "Es unimembre con marca de pasiva refleja impersonal." },
            { text: "¡Socorro!", type: "OU", explanation: "Es unimembre interjectiva." },
            { text: "Hace tres años de eso.", type: "OU", explanation: "Es unimembre con el verbo impersonal que indica transcurso temporal." },
            { text: "¡Atención!", type: "OU", explanation: "Es unimembre nominal imperativa." },
            { text: "Niebla densa.", type: "OU", explanation: "Es unimembre nominal descriptiva." },
            { text: "¡Hasta luego!", type: "OU", explanation: "Es unimembre fórmula de cortesía o despedida." },
            { text: "Huele a quemado.", type: "OU", explanation: "Es unimembre construida de forma impersonal." },
            { text: "¡Dios mío!", type: "OU", explanation: "Es unimembre exclamativa nominal." },

            // BIMEMBRES (OB)
            { text: "El perro corre por el parque.", type: "OB", explanation: "Es bimembre: el sujeto es 'El perro' y el predicado 'corre por el parque'." },
            { text: "María compró flores frescas.", type: "OB", explanation: "Es bimembre: sujeto explícito ('María') y predicado ('compró flores frescas')." },
            { text: "Los niños juegan en la plaza.", type: "OB", explanation: "Es bimembre: sujeto ('Los niños') y predicado ('juegan en la plaza')." },
            { text: "El sol brilla intensamente.", type: "OB", explanation: "Es bimembre: cuenta con sujeto ('El sol') y predicado ('brilla intensamente')." },
            { text: "Mi hermano estudia medicina.", type: "OB", explanation: "Es bimembre: sujeto ('Mi hermano') y predicado ('estudia medicina')." },
            { text: "Las aves migran hacia el sur.", type: "OB", explanation: "Es bimembre: sujeto ('Las aves') y predicado ('migran hacia el sur')." },
            { text: "El profesor explicó la lección.", type: "OB", explanation: "Es bimembre: sujeto ('El profesor') y predicado ('explicó la lección')." },
            { text: "Un coche rojo cruzó la calle.", type: "OB", explanation: "Es bimembre: sujeto ('Un coche rojo') y predicado ('cruzó la calle')." },
            { text: "La sopa está muy caliente.", type: "OB", explanation: "Es bimembre: sujeto ('La sopa') y predicado ('está muy caliente')." },
            { text: "Los vecinos organizaron una fiesta.", type: "OB", explanation: "Es bimembre: sujeto ('Los vecinos') y predicado ('organizaron una fiesta')." },
            { text: "Esa novela ganó un premio.", type: "OB", explanation: "Es bimembre: sujeto ('Esa novela') y predicado ('ganó un premio')." },
            { text: "Los gatos duermen plácidamente.", type: "OB", explanation: "Es bimembre: sujeto ('Los gatos') y predicado ('duermen plácidamente')." },
            { text: "El viento soplaba con fuerza.", type: "OB", explanation: "Es bimembre: sujeto ('El viento') y predicado ('soplaba con fuerza')." },
            { text: "Mi madre preparó un pastel.", type: "OB", explanation: "Es bimembre: sujeto ('Mi madre') y predicado ('preparó un pastel')." },
            { text: "Los alumnos entregaron la tarea.", type: "OB", explanation: "Es bimembre: sujeto ('Los alumnos') y predicado ('entregaron la tarea')." },
            { text: "El teléfono suena sin parar.", type: "OB", explanation: "Es bimembre: sujeto ('El teléfono') y predicado ('suena sin parar')." },
            { text: "La luna ilumina la noche.", type: "OB", explanation: "Es bimembre: sujeto ('La luna') y predicado ('ilumina la noche')." },
            { text: "Los turistas visitaron el museo.", type: "OB", explanation: "Es bimembre: sujeto ('Los turistas') y predicado ('visitaron el museo')." },
            { text: "Un fuerte temblor asustó a todos.", type: "OB", explanation: "Es bimembre: sujeto ('Un fuerte temblor') y predicado ('asustó a todos')." },
            { text: "El río lleva mucha agua.", type: "OB", explanation: "Es bimembre: sujeto ('El río') y predicado ('lleva mucha agua')." },
            { text: "Las flores adornan el jardín.", type: "OB", explanation: "Es bimembre: sujeto ('Las flores') y predicado ('adornan el jardín')." },
            { text: "El tren llegó con retraso.", type: "OB", explanation: "Es bimembre: sujeto ('El tren') y predicado ('llegó con retraso')." },
            { text: "Mi abuela canta muy bien.", type: "OB", explanation: "Es bimembre: sujeto ('Mi abuela') y predicado ('canta muy bien')." },
            { text: "Los jugadores celebraron el triunfo.", type: "OB", explanation: "Es bimembre: sujeto ('Los jugadores') y predicado ('celebraron el triunfo')." },
            { text: "El cielo está completamente despejado.", type: "OB", explanation: "Es bimembre: sujeto ('El cielo') y predicado ('está completamente despejado')." },
            { text: "Una fuerte tormenta canceló el vuelo.", type: "OB", explanation: "Es bimembre: sujeto ('Una fuerte tormenta') y predicado ('canceló el vuelo')." },
            { text: "El mecánico arregló nuestro auto.", type: "OB", explanation: "Es bimembre: sujeto ('El mecánico') y predicado ('arregló nuestro auto')." },
            { text: "Las estrellas brillan en el firmamento.", type: "OB", explanation: "Es bimembre: sujeto ('Las estrellas') y predicado ('brillan en el firmamento')." },
            { text: "El joven pintor expuso sus obras.", type: "OB", explanation: "Es bimembre: sujeto ('El joven pintor') y predicado ('expuso sus obras')." },
            { text: "La música suena en la radio.", type: "OB", explanation: "Es bimembre: sujeto ('La música') y predicado ('suena en la radio')." }
        ];

        let questions = [];
        let currentIdx = 0;
        let score = 0;
        let playerName = "";

        const welcomeBox = document.getElementById("welcome-box");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const studentNameInput = document.getElementById("student-name");
        const greetingTitle = document.getElementById("greeting-title");
        
        const sentenceText = document.getElementById("sentence-text");
        const progressEl = document.getElementById("progress");
        const scoreEl = document.getElementById("score");
        const feedbackEl = document.getElementById("feedback");
        const nextBtn = document.getElementById("next-btn");
        const btnOU = document.getElementById("btn-ou");
        const btnOB = document.getElementById("btn-ob");
        const finalScore = document.getElementById("final-score");
        const resName = document.getElementById("res-name");

        function startGame() {
            playerName = studentNameInput.value.trim();
            if (playerName === "") {
                alert("Por favor, ingresa tu nombre para continuar.");
                return;
            }

            // Seleccionar 10 preguntas aleatorias del banco total cada vez que inicia
            questions = [...masterQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
            currentIdx = 0;
            score = 0;

            welcomeBox.classList.add("hidden");
            quizBox.classList.remove("hidden");
            greetingTitle.textContent = `¡Mucho éxito, ${playerName}!`;
            loadQuestion();
        }

        function loadQuestion() {
            feedbackEl.className = "hidden";
            feedbackEl.textContent = "";
            nextBtn.classList.add("hidden");
            
            btnOU.disabled = false;
            btnOB.disabled = false;

            const current = questions[currentIdx];
            sentenceText.textContent = `"${current.text}"`;
            progressEl.textContent = `Pregunta ${currentIdx + 1} de ${questions.length}`;
            scoreEl.textContent = `Puntuación: ${score}`;
        }

        function checkAnswer(selectedType) {
            btnOU.disabled = true;
            btnOB.disabled = true;

            const current = questions[currentIdx];
            if (selectedType === current.type) {
                score++;
                feedbackEl.innerHTML = `<strong>¡Correcto!</strong> ${current.explanation}`;
                feedbackEl.className = "correct";
            } else {
                feedbackEl.innerHTML = `<strong>Incorrecto.</strong> ${current.explanation}`;
                feedbackEl.className = "incorrect";
            }

            scoreEl.textContent = `Puntuación: ${score}`;
            
            if (currentIdx < questions.length - 1) {
                nextBtn.classList.remove("hidden");
            } else {
                setTimeout(showResults, 1800);
            }
        }

        function nextQuestion() {
            currentIdx++;
            loadQuestion();
        }

        function showResults() {
            quizBox.classList.add("hidden");
            resultBox.classList.remove("hidden");
            resName.textContent = playerName;
            finalScore.textContent = `Has obtenido ${score} aciertos de ${questions.length} posibles.`;
        }

        function restartGame() {
            resultBox.classList.add("hidden");
            welcomeBox.classList.remove("hidden");
            studentNameInput.value = "";
        }
    </script>
</body>
</html>
