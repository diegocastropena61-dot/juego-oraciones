<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Sintáctico: Oraciones Unimembres y Bimembres</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 1rem;
        }

        .game-container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header h1 {
            color: #4338ca;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Pantalla de Inicio */
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #334155;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #6366f1;
        }

        /* Estadísticas del juego */
        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #475569;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 10px;
        }

        .sentence-card {
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            padding: 2rem 1rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
        }

        .sentence-card h2 {
            font-size: 1.35rem;
            color: #0f172a;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s, box-shadow 0.2s;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.unimembre {
            background-color: #f59e0b;
        }
        .btn.unimembre:hover {
            background-color: #d97706;
        }

        .btn.bimembre {
            background-color: #10b981;
        }
        .btn.bimembre:hover {
            background-color: #059669;
        }

        .btn.primary, .btn.restart {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            width: 100%;
        }

        .btn.next {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            width: 100%;
            margin-top: 1rem;
        }

        #feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 500;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        #feedback.correct {
            background-color: #dcfce7;
            color: #166534;
            border-left: 5px solid #22c55e;
        }

        #feedback.incorrect {
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 5px solid #ef4444;
        }

        .trophy {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="welcome-box">
            <header>
                <h1>🎓 Desafío Sintáctico</h1>
                <p>Pon a prueba tus conocimientos sobre <strong>Oraciones Unimembres y Bimembres</strong>.</p>
            </header>
            <div class="input-group">
                <label for="student-name">Ingresa tu nombre completo:</label>
                <input type="text" id="student-name" placeholder="Ej. Ana Pérez" autocomplete="off">
            </div>
            <button class="btn primary" onclick="startGame()">Comenzar Reto</button>
        </div>

        <div id="quiz-box" class="hidden">
            <header>
                <h1 id="greeting-title">¡Hola!</h1>
                <p>Clasifica correctamente cada oración:</p>
            </header>

            <div class="stats">
                <span id="progress">Pregunta 1 de 10</span>
                <span id="score">Puntuación: 0</span>
            </div>

            <div class="sentence-card">
                <h2 id="sentence-text">Cargando oración...</h2>
            </div>

            <div class="button-group">
                <button id="btn-ou" class="btn unimembre" onclick="checkAnswer('OU')">Unimembre (OU)</button>
                <button id="btn-ob" class="btn bimembre" onclick="checkAnswer('OB')">Bimembre (OB)</button>
            </div>

            <div id="feedback" class="hidden"></div>
            
            <button id="next-btn" class="btn next hidden" onclick="nextQuestion()">Siguiente Pregunta ➔</button>
        </div>

        <div id="result-box" class="hidden">
            <div class="trophy">🏆</div>
            <h2>¡Felicitaciones, <span id="res-name"></span>!</h2>
            <p id="final-score" style="margin: 1.2rem 0; font-size: 1.1rem; color: #475569;">Tu puntuación final es: 0 de 10</p>
            <button class="btn restart" onclick="restartGame()">Jugar de Nuevo 🔄</button>
        </div>
    </div>

    <script>
        const questions = [
            { text: "¡Llueve torrencialmente en la ciudad!", type: "OU", explanation: "Es unimembre porque tiene un verbo impersonal referido a fenómenos meteorológicos, sin sujeto." },
            { text: "Los estudiantes aprobaron el examen de sintaxis.", type: "OB", explanation: "Es bimembre: tiene un sujeto ('Los estudiantes') y un predicado ('aprobaron el examen de sintaxis')." },
            { text: "Había muchos participantes en el concurso.", type: "OU", explanation: "Es unimembre porque el verbo 'haber' es impersonal y no posee un sujeto gramatical." },
            { text: "El viento soplaba con muchísima fuerza anoche.", type: "OB", explanation: "Es bimembre: el sujeto es 'El viento' y el predicado es 'soplaba con muchísima fuerza anoche'." },
            { text: "¡Fuego!", type: "OU", explanation: "Es unimembre exclamativa; expresa un concepto completo pero carece de estructura de sujeto y predicado." },
            { text: "Hace demasiado frío durante las mañanas de invierno.", type: "OU", explanation: "Es unimembre debido a que el verbo 'hacer' actúa de forma impersonal." },
            { text: "Mi profesora favorita explicó la clase magistral.", type: "OB", explanation: "Es bimembre: sujeto ('Mi profesora favorita') y predicado ('explicó la clase magistral')." },
            { text: "¡Silencio en la sala!", type: "OU", explanation: "Es unimembre nominal; transmite una orden directa sin descomponerse en sujeto y predicado." },
            { text: "Varias aves migraban hacia el sur cálido.", type: "OB", explanation: "Es bimembre: sujeto ('Varias aves') y predicado ('migraban hacia el sur cálido')." },
            { text: "Es tarde para salir de excursión.", type: "OU", explanation: "Es unimembre porque emplea el verbo copulativo 'ser' de forma impersonal para indicar tiempo." }
        ];

        let currentIdx = 0;
        let score = 0;
        let playerName = "";

        const welcomeBox = document.getElementById("welcome-box");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const studentNameInput = document.getElementById("student-name");
        const greetingTitle = document.getElementById("greeting-title");
        
        const sentenceText = document.getElementById("sentence-text");
        const progressEl = document.getElementById("progress");
        const scoreEl = document.getElementById("score");
        const feedbackEl = document.getElementById("feedback");
        const nextBtn = document.getElementById("next-btn");
        const btnOU = document.getElementById("btn-ou");
        const btnOB = document.getElementById("btn-ob");
        const finalScore = document.getElementById("final-score");
        const resName = document.getElementById("res-name");

        function startGame() {
            playerName = studentNameInput.value.trim();
            if (playerName === "") {
                alert("Por favor, ingresa tu nombre para continuar.");
                return;
            }

            welcomeBox.classList.add("hidden");
            quizBox.classList.remove("hidden");
            greetingTitle.textContent = `¡Mucho éxito, ${playerName}!`;
            loadQuestion();
        }

        function loadQuestion() {
            feedbackEl.className = "hidden";
            feedbackEl.textContent = "";
            nextBtn.classList.add("hidden");
            
            btnOU.disabled = false;
            btnOB.disabled = false;

            const current = questions[currentIdx];
            sentenceText.textContent = `"${current.text}"`;
            progressEl.textContent = `Pregunta ${currentIdx + 1} de${questions.length}`;
            scoreEl.textContent = `Puntuación: ${score}`;
        }

        function checkAnswer(selectedType) {
            btnOU.disabled = true;
            btnOB.disabled = true;

            const current = questions[currentIdx];
            if (selectedType === current.type) {
                score++;
                feedbackEl.innerHTML = `<strong>¡Correcto!</strong> ${current.explanation}`;
                feedbackEl.className = "correct";
            } else {
                feedbackEl.innerHTML = `<strong>Incorrecto.</strong> ${current.explanation}`;
                feedbackEl.className = "incorrect";
            }

            scoreEl.textContent = `Puntuación: ${score}`;
            
            if (currentIdx < questions.length - 1) {
                nextBtn.classList.remove("hidden");
            } else {
                setTimeout(showResults, 1800);
            }
        }

        function nextQuestion() {
            currentIdx++;
            loadQuestion();
        }

        function showResults() {
            quizBox.classList.add("hidden");
            resultBox.classList.remove("hidden");
            resName.textContent = playerName;
            finalScore.textContent = `Has obtenido ${score} ac
